name: Release

# App-mode release pipeline (Paddock is an app, not published npm libraries):
#   1. On push to main, changesets maintains a "Version Packages" PR that bumps
#      the app version (@paddock/server + @paddock/web are `fixed`, so they move
#      together) and updates CHANGELOG.md.
#   2. When that PR is merged, no changesets remain, the app version has changed,
#      and no v<version> tag exists yet → the `artifacts` job builds & publishes:
#        - the multi-arch Docker image  ghcr.io/edspencer/paddock:<version> + :latest
#        - a self-contained release tarball attached to a GitHub Release v<version>
#
# Both jobs run in the SAME workflow run (the push that merges the version PR),
# so we never rely on GITHUB_TOKEN pushing a tag to trigger a second workflow
# (which GitHub blocks).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Version PR / detect release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      should_release: ${{ steps.detect.outputs.should_release }}
      version: ${{ steps.detect.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Opens/updates the "Version Packages" PR while changesets are present.
      # No `publish:` — the packages are private; we never npm-publish.
      - name: Changesets version PR
        id: changesets
        uses: changesets/action@v1
        with:
          version: npm run changeset:version
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # After a version PR merges there are no changesets left. If the current
      # app version has no v<version> tag yet, this is a fresh release.
      - name: Detect release
        id: detect
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          VERSION="$(node -p "require('./packages/server/package.json').version")"
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "v${VERSION} already released — nothing to do"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "new release: v${VERSION}"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          fi

  # A release must be impossible to publish unless CI actually passed on the
  # very commit being released.
  #
  # Why this is needed. The changesets "version packages" PR is opened by
  # `github-actions[bot]`, and GitHub parks workflow runs from bot-authored PRs
  # at `action_required` pending manual approval. Nothing surfaces that, so the
  # PR merges showing only the external checks (Cloudflare, GitGuardian) green
  # while typecheck / unit / E2E never ran at all. This is not hypothetical and
  # not local to us: every run on `changeset-release/main` in BOTH this repo and
  # edspencer/herdctl has been parked that way. v0.54.2 shipped like it.
  #
  # CI on `main` is NOT gated — a human pushes the merge, so it runs normally.
  # The trustworthy signal already existed; it simply had no consumer. This job
  # is that consumer, and it sits ahead of `build-image` so a red CI blocks the
  # GHCR pushes too, not just the tarball and the GitHub Release.
  #
  # If CI is red for a reason you judge unrelated (a flake), fix or re-run CI
  # until it is green, then re-run this workflow via Actions → Release → Run
  # workflow. Overriding is deliberately a conscious act, not the default path.
  verify-ci:
    name: Require CI green on this commit
    needs: release
    if: needs.release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Wait for CI on this commit, and require success
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          deadline=$(( SECONDS + 1800 ))   # 30 minutes; E2E alone runs ~3-4 min
          while :; do
            # `// empty` so an as-yet-uncreated run prints nothing rather than
            # failing jq on null — the Release and CI runs start concurrently.
            line="$(gh api \
              "repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=${SHA}&event=push&per_page=1" \
              --jq '.workflow_runs[0] // empty | "\(.status)\t\(.conclusion // "-")\t\(.html_url)"' \
              2>/dev/null || true)"

            if [ -n "${line}" ]; then
              status="$(printf '%s' "${line}" | cut -f1)"
              conclusion="$(printf '%s' "${line}" | cut -f2)"
              url="$(printf '%s' "${line}" | cut -f3)"

              if [ "${status}" = "completed" ]; then
                if [ "${conclusion}" = "success" ]; then
                  echo "CI passed on ${SHA} — ${url}"
                  exit 0
                fi
                echo "::error::CI concluded '${conclusion}' on ${SHA}. Refusing to publish a release from a commit whose CI did not pass. See ${url}"
                exit 1
              fi
              echo "CI is ${status} on ${SHA} — waiting. ${url}"
            else
              echo "No CI run found for ${SHA} yet — waiting."
            fi

            if [ "${SECONDS}" -ge "${deadline}" ]; then
              echo "::error::Timed out after 30m waiting for CI to complete on ${SHA}. Refusing to publish."
              exit 1
            fi
            sleep 20
          done

  # Build each (target × arch) on a NATIVE runner (amd64 on x86, arm64 on
  # GitHub's free arm runners) instead of emulating arm64 under QEMU on one x86
  # runner — emulation made this step take ~9-10 min; native runners take
  # ~1-2 min each, in parallel. Each leg pushes by digest; `artifacts` merges
  # one manifest per target (base + devbox). The cross-product of `target` and
  # `platform` is 4 legs; the `include` entries attach arch+runner to every
  # combination that shares their `platform`.
  build-image:
    name: Build image (${{ matrix.target }} · ${{ matrix.platform }})
    needs: [release, verify-ci]
    if: needs.release.outputs.should_release == 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: [base, devbox]
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/edspencer/paddock,push-by-digest=true,name-canonical=true,push=true
          # Separate cache scope per target: base and devbox share the build +
          # base layers, but devbox stacks the heavy browser layer on top.
          cache-from: type=gha,scope=${{ matrix.target }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}-${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.target }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  artifacts:
    name: Publish image + tarball + release
    needs: [release, build-image]
    if: needs.release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release + tag
      packages: write # push the merged manifest to GHCR
    env:
      VERSION: ${{ needs.release.outputs.version }}
      IMAGE: ghcr.io/edspencer/paddock
    steps:
      # Full history: the final step commits the regenerated OpenAPI spec back to
      # main, and `git rebase origin/main` cannot graft onto a depth-1 shallow
      # clone if main moved while the images were building.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build (server + web)
        run: npm run build

      # ---- release tarball ----
      - name: Build tarball
        run: bash scripts/make-tarball.sh

      # ---- assemble one multi-arch manifest per target from per-arch digests ----
      # Keep each artifact in its own subdir (no merge-multiple) so the base and
      # devbox digests stay separable: digests-<target>-<arch>/<digest>.
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # base   → :<version> + :latest
      # devbox → :<version>-devbox + :devbox
      - name: Tag multi-arch images
        run: |
          set -euo pipefail
          # download-artifact@v4 lands each per-arch digest in its own
          # digests-<target>-<arch>/ subdir, one file whose NAME is the digest.
          # Iterate the files directly (basename = digest); do NOT `ls` the
          # dirs -- `ls` prints a "dir:" header per directory when given more
          # than one, which corrupts the reference list (invalid reference).
          collect_digests() {
            for f in /tmp/digests/"$1"-*/*; do
              printf "%s@sha256:%s " "${IMAGE}" "$(basename "$f")"
            done
          }
          base_digests="$(collect_digests digests-base)"
          devbox_digests="$(collect_digests digests-devbox)"

          docker buildx imagetools create \
            -t "${IMAGE}:${VERSION}" \
            -t "${IMAGE}:latest" \
            ${base_digests}

          docker buildx imagetools create \
            -t "${IMAGE}:${VERSION}-devbox" \
            -t "${IMAGE}:devbox" \
            ${devbox_digests}

      - name: Inspect images
        run: |
          docker buildx imagetools inspect "${IMAGE}:${VERSION}"
          docker buildx imagetools inspect "${IMAGE}:${VERSION}-devbox"

      # ---- stable-named ("latest") copies ----
      # GitHub's `releases/latest/download/<asset>` redirect only resolves when
      # <asset> has the SAME filename in every release, so the version-named
      # paddock-<version>.tgz can't be reached that way. Attach an identical
      # copy under a fixed name (paddock-latest.tgz) so
      # releases/latest/download/paddock-latest.tgz always points at the newest
      # build, while keeping the pinned paddock-<version>.tgz too. See #454.
      - name: Stage stable-named tarball
        run: |
          set -euo pipefail
          cp "paddock-${VERSION}.tgz" "paddock-latest.tgz"
          # Regenerate the checksum against the stable filename so
          # `sha256sum -c paddock-latest.tgz.sha256` verifies as-is.
          ( command -v sha256sum >/dev/null \
              && sha256sum "paddock-latest.tgz" \
              || shasum -a 256 "paddock-latest.tgz" ) > "paddock-latest.tgz.sha256"

      # ---- GitHub Release (creates the v<version> tag at this SHA) ----
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --generate-notes \
            "paddock-${VERSION}.tgz" \
            "paddock-${VERSION}.tgz.sha256" \
            "paddock-latest.tgz" \
            "paddock-latest.tgz.sha256"

      # ---- refresh the published OpenAPI reference ----
      # openapi-site/open-api.json is what the docs site publishes at /api/
      # (website's `prebuild` copies openapi-site/ into public/api/). It is
      # DERIVED from the route schemas, and its `info.version` is stamped from
      # packages/server/package.json -- so it goes stale the instant changesets
      # cuts a version, and there is no earlier point in the pipeline where the
      # new version number exists. Regenerate + commit here so the published
      # reference tracks the release without anyone remembering to do it.
      #
      # Deliberately NOT a "fail if the committed spec differs" drift check: the
      # version stamp guarantees a difference at every release, so that gate
      # would be red on every run of the one event it is meant to guard.
      #
      # `npm run build` above already produced packages/server/dist, which the
      # dump script boots in-process against a throwaway temp dir (no port
      # bound, no real data). Runs after the Release so a failure here can never
      # cost us the tag or the artifacts.
      - name: Regenerate OpenAPI spec
        run: node scripts/dump-openapi.mjs

      # Pushes made with GITHUB_TOKEN do not trigger workflows, so this cannot
      # loop back into Release. The v<version> tag was already created above, at
      # the release commit, so it is unaffected.
      #
      # Deliberately NO `[skip ci]` marker: Cloudflare Pages honours that token
      # too, and skipping the Pages build is precisely what we must not do --
      # rebuilding the docs site is how the refreshed spec actually reaches
      # /api/. Suppressing Actions is already handled by GITHUB_TOKEN.
      - name: Commit the refreshed spec
        run: |
          set -euo pipefail
          if git diff --quiet -- openapi-site/open-api.json; then
            echo "spec already current for v${VERSION} — nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add openapi-site/open-api.json
          git commit -m "chore: refresh OpenAPI spec for v${VERSION}"
          # The concurrency group serialises Release runs, but main can still
          # have moved while the images built. Rebase rather than fail a release
          # that has already published everything.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

  # ---- npm package ---------------------------------------------------------
  # Publishes @edspencer/paddock (#637) — the `npx @edspencer/paddock` entry
  # point. Independent of the Docker/tarball job: it needs neither the per-arch
  # digests nor a GitHub Release, so it runs alongside them off `release`.
  #
  # Auth is OIDC trusted publishing — no NPM_TOKEN secret exists or is wanted.
  # That requires `id-token: write` below, npm >= 11.5.1 (Node 22 ships npm 10),
  # and a trusted publisher configured for this package + workflow at
  # npmjs.com/package/@edspencer/paddock/access.
  #
  # Provenance is requested explicitly via publishConfig.provenance in the
  # synthesized manifest rather than relying on trusted publishing's implicit
  # behaviour — see scripts/make-npm-package.mjs.
  #
  # NOTE: the very first publish of a new package CANNOT use OIDC — npm has no
  # settings page for a package that does not exist yet (npm/cli#8544). v1 was
  # published by hand; every release after it comes through here.
  publish-npm:
    name: Publish npm package
    needs: [release]
    if: needs.release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC — trusted publishing + provenance
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          # Without this, npm never writes a registry line into .npmrc and the
          # publish fails to authenticate even with a valid OIDC token.
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - run: npm ci

      - name: Build (server + web)
        run: npm run build

      - name: Stage the npm package
        run: node scripts/make-npm-package.mjs

      - name: Publish
        run: npm publish
        working-directory: dist-npm

      - name: Verify provenance landed
        run: |
          set -euo pipefail
          for i in $(seq 1 10); do
            if npm view "@edspencer/paddock@${VERSION}" dist.attestations.provenance --json | grep -q slsa; then
              echo "provenance attested for ${VERSION}"; exit 0
            fi
            echo "attestation not visible yet (attempt $i) — waiting"; sleep 15
          done
          echo "::error::published ${VERSION} but no provenance attestation appeared" >&2
          exit 1
